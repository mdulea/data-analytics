[project]
name = "data-analytics"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pyarrow>=26.0.1",
    "python-calamine>=0.9.1",
    "sdv>=2.2.0",
]

[dependency-groups]
dev = [
    "pandas-stubs>=2.3.3,<2.4",
    "pyright>=1.1.414",
    "ruff>=0.17.4",
]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
extraPaths = ["."]
reportUnnecessaryTypeIgnoreComment = "error"
